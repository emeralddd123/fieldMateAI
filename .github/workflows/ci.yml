name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  deploy-production:
    name: Deploy production
    needs: validate
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      vars.ENABLE_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: fieldmate-production
      cancel-in-progress: false
    steps:
      - name: Deploy merged commit to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          port: ${{ vars.VPS_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          fingerprint: ${{ vars.VPS_HOST_FINGERPRINT }}
          envs: DEPLOY_PATH,DEPLOY_SHA
          command_timeout: 30m
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test "$(git branch --show-current)" = "main"
            ./scripts/backup-vps.sh
            git fetch --prune origin main
            git merge --ff-only "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            ./scripts/deploy-vps.sh
